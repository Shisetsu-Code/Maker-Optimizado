name: Restore authorized graphic library
on:
  push:
    branches: [rebuild/clean]
    paths: ['.github/workflows/restore-media.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Import pinned graphical resources
        run: |
          git fetch --depth=1 origin 8a8b09cfdda55d8233b2d61c4d878bb112f4f591
          python3 scripts/import-media.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit media library
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media assets docs/asset-provenance.json src
          if ! git diff --cached --quiet; then git commit -m 'Restore user-authorized original graphical resources with content-addressed names'; fi
          git push origin HEAD:rebuild/clean
      - name: Verify complete tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref rebuild/clean
