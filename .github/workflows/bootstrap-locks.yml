name: Materialize verified lockfiles
on:
  push:
    branches: [rebuild/clean]
    paths: ['.github/workflows/bootstrap-locks.yml']
permissions:
  contents: write
  actions: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Recover exact resolved dependency locks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45848700453 --name dependency-locks --dir .
          test -s Cargo.lock
          test -s package-lock.json
      - name: Format Rust source
        run: cargo fmt --all
      - name: Record lockfiles and format
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock package-lock.json src
          git commit -m 'Record verified dependency lockfiles and format Rust source'
          git push origin HEAD:rebuild/clean
