name: Original visual comparison
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'public/**'
      - 'scripts/compare-visual.mjs'
      - '.github/workflows/visual.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Shisetsu-Code/Maker
          ref: 9bc456f6ed1b4344a0cf4fb2e84ca4791061ba10
          path: reference
          sparse-checkout: public
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: |
          npm ci
          cargo install worker-build --version 0.9.0 --locked
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          npx --no-install playwright install --with-deps chromium
      - run: |
          mkdir -p work
          python3 -m http.server 8788 --bind 127.0.0.1 --directory reference/public >work/reference.log 2>&1 &
          npm run dev >work/worker.log 2>&1 &
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8787/api/v1/health; then break; fi
            sleep 2
          done
          node scripts/compare-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maker-original-comparison
          path: |
            work/visual/
            work/worker.log
          retention-days: 30
