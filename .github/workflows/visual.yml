name: Original visual comparison
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'public/**'
      - 'scripts/compare-visual.mjs'
      - '.github/workflows/visual.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Shisetsu-Code/Maker
          ref: 9bc456f6ed1b4344a0cf4fb2e84ca4791061ba10
          path: reference
          sparse-checkout: public
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Restore pinned build tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
          key: ${{ runner.os }}-${{ runner.arch }}-worker-build-0.9.0-bindgen-0.2.130-${{ hashFiles('rust-toolchain.toml') }}
      - run: |
          npm ci
          command -v worker-build >/dev/null || cargo install worker-build --version 0.9.0 --locked
          command -v wasm-bindgen >/dev/null || cargo install wasm-bindgen-cli --version 0.2.130 --locked
          npx --no-install playwright install --with-deps chromium
      - run: |
          mkdir -p work
          python3 -m http.server 8788 --bind 127.0.0.1 --directory reference/public >work/reference.log 2>&1 &
          npm run dev >work/worker.log 2>&1 &
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8787/api/v1/health; then break; fi
            sleep 2
          done
          node scripts/compare-visual.mjs
      - name: Build approval gallery from this revision
        if: ${{ always() && hashFiles('work/visual/comparison.json') != '' }}
        run: |
          python3 -m venv /tmp/review-photos
          /tmp/review-photos/bin/pip install Pillow
          /tmp/review-photos/bin/python scripts/review-sheets.py work/visual work/visual/approval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maker-original-comparison
          path: |
            work/visual/
            work/worker.log
          retention-days: 30
