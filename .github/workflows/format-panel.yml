name: Format and validate panel integration
on:
  push:
    branches: [rebuild/clean]
    paths: ['.github/workflows/format-panel.yml']
permissions:
  contents: write
  actions: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - run: |
          cargo fmt --all
          cargo test --locked --lib
          cargo check --locked --target wasm32-unknown-unknown --lib
          cargo check --locked --target wasm32-unknown-unknown --no-default-features --features browser --lib
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git rm .github/workflows/format-panel.yml
          git commit -m 'Format and validate Rust administrative preview'
          git push origin HEAD:rebuild/clean
      - name: Run full CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref rebuild/clean
