name: Maker clean verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install pinned Rust
        run: rustup show
      - name: Check committed lockfiles and formatting
        run: |
          test -s Cargo.lock
          test -s package-lock.json
          cargo fmt --all -- --check
      - name: Native and edge tests
        run: |
          cargo test --locked --lib
          cargo check --locked --target wasm32-unknown-unknown --lib
          cargo check --locked --target wasm32-unknown-unknown --no-default-features --features browser --lib
      - name: Preserve lockfiles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-locks
          path: |
            Cargo.lock
            package-lock.json
      - name: Install tooling
        run: |
          cargo install worker-build --version 0.9.0 --locked
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          npm ci
      - name: Verify restored graphic library
        run: npm run test:media
      - name: WASM tests
        run: |
          npm test
          node --test tests/catalog.test.mjs
      - name: Cloudflare dry-run
        run: npx --no-install wrangler deploy --dry-run
      - name: Browser runtime
        run: npx --no-install playwright install --with-deps chromium
      - name: Runtime and E2E
        env:
          DEMO_ORIGIN: http://127.0.0.1:8787
          WRANGLER_SEND_METRICS: 'false'
        run: |
          mkdir -p work
          npm run dev >work/worker.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; tail -100 work/worker.log' EXIT
          for i in $(seq 1 120); do
            if curl -fsS "$DEMO_ORIGIN/api/v1/health"; then break; fi
            sleep 2
          done
          curl -fsS "$DEMO_ORIGIN/api/v1/health"
          npm run test:runtime
          npm run test:browser
