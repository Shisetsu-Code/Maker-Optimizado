name: Inspect classic presentation sources
on:
  workflow_dispatch:
  push:
    paths: ['scripts/inspect-classic-sources.mjs']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Shisetsu-Code/Maker
          ref: 9bc456f6ed1b4344a0cf4fb2e84ca4791061ba10
          path: reference
          sparse-checkout: public
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: |
          npm ci
          python3 -m http.server 8788 --bind 127.0.0.1 --directory reference/public >/tmp/reference.log 2>&1 &
          CAPTURE_MOBILE=1 node scripts/inspect-classic-sources.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: original-classic-layouts
          path: '*-source.json.gz'
          retention-days: 30
