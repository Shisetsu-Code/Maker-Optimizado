[package]
name = "maker-studio"
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["edge"]
edge = ["dep:worker", "dep:futures-util"]
browser = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.154"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "=0.9.0", optional = true }
futures-util = { version = "=0.3.34", default-features = false, optional = true }
wasm-bindgen = { version = "=0.2.130", optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
