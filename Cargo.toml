[package]
name = "maker-optimized"
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["edge"]
edge = ["dep:worker", "dep:futures-util"]
browser = ["dep:wasm-bindgen"]
asset-cli = ["dep:sha2"]

[dependencies]
serde_json = "=1.0.145"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "=0.8.7", optional = true }
futures-util = { version = "=0.3.31", default-features = false, optional = true }
wasm-bindgen = { version = "=0.2.130", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sha2 = { version = "=0.10.9", optional = true }

[[bin]]
name = "asset-audit"
path = "src/bin/asset_audit.rs"
required-features = ["asset-cli"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
